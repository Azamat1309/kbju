<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fafaf8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Трекер">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Трекер — КБЖУ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fafaf8;--ink:#111;--mute:#6f6f6b;--line:#e4e3df;--soft:#f2f1ee;--p:#2f5d50;--f:#b0793a;--c:#4a5d8a;--warn:#a3402e;--ok:#2f6b45}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Inter Tight','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 20px calc(96px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit;border-radius:0}
button{cursor:pointer}
h1,h2,h3{font-weight:300;letter-spacing:-.02em;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;padding:6px 0 14px;border-bottom:1px solid var(--ink)}
.logo{font-weight:600;font-size:13px;letter-spacing:.32em}
.kick{font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.lnk{background:none;border:0;padding:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.btn{display:block;width:100%;min-height:52px;margin-top:16px;border:1px solid var(--ink);background:var(--ink);color:#fff;font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase}
.btn.ghost{background:transparent;color:var(--ink)}.btn[disabled]{opacity:.3}
.sec{padding:22px 0;border-bottom:1px solid var(--line)}
.sec h3{font-size:24px;margin:4px 0 6px}
.muted{color:var(--mute);font-size:13px}
/* день */
.daynav{display:flex;justify-content:space-between;align-items:center;padding:14px 0 0}
.daynav button{border:0;background:none;font-size:20px;padding:4px 10px}
.daynav b{font-weight:500;font-size:14px;letter-spacing:.04em}
.hero{display:flex;gap:20px;align-items:center;padding:20px 0 6px}
.ring{flex:0 0 150px;height:150px;position:relative}
.ring svg{width:150px;height:150px;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .in b{font-size:30px;font-weight:300;letter-spacing:-.03em;line-height:1}
.ring .in span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-top:4px}
.macros{flex:1;display:grid;gap:12px}
.mac .row{display:flex;justify-content:space-between;font-size:12.5px}
.mac .row b{font-weight:500}
.bar{height:4px;background:var(--line);margin-top:5px;position:relative;overflow:hidden}.bar i{position:absolute;left:0;top:0;bottom:0}
.bar.over i{background:var(--warn)!important}
.chips{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;padding:8px 12px;font-size:12px;letter-spacing:.06em}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.meal{border-top:1px solid var(--ink);margin-top:22px;padding-top:10px}
.meal .mh{display:flex;justify-content:space-between;align-items:baseline}
.meal .mh h3{font-size:20px}
.ent{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.ent .tx{flex:1;min-width:0}.ent .tx b{display:block;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ent .tx span{font-size:12px;color:var(--mute)}
.ent .k{font-size:15px;font-weight:500;white-space:nowrap}
.ent .x{border:0;background:none;color:var(--mute);font-size:18px;padding:0 4px}
.empty{padding:12px 0;color:var(--mute);font-size:13px}
.water{display:flex;align-items:center;gap:6px}
.water i{width:calc((100% - 72px)/13);height:30px;border:1px solid var(--ink);display:inline-block;cursor:pointer}
.water i.on{background:var(--c)}
.tip{border-left:2px solid var(--ink);padding:4px 0 4px 14px;margin:12px 0;font-size:14px}
.tip.warn{border-color:var(--warn)}.tip.ok{border-color:var(--ok)}
.tip b{display:block;font-weight:500;font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:2px}
/* таббар */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--ink);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tabbar div{display:flex;max-width:560px;width:100%}
.tabbar button{flex:1;border:0;background:none;padding:12px 0 12px;font-size:10.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.tabbar button.on{color:var(--ink)}
.tabbar button.add{flex:0 0 64px;background:var(--ink);color:#fff;font-size:26px;font-weight:300;letter-spacing:0}
/* шторка */
.sheet{position:fixed;inset:0;background:rgba(17,17,17,.4);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet .pn{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:16px 20px calc(24px + env(safe-area-inset-bottom))}
.seg{display:flex;border:1px solid var(--ink);margin:12px 0 16px;overflow-x:auto}
.seg button{flex:1 0 auto;border:0;background:none;padding:10px 10px;font-size:10.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.seg button.on{background:var(--ink);color:#fff}
.fld{display:block;margin-top:12px}
.fld span{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.fld input,.fld select{width:100%;height:46px;border:0;border-bottom:1px solid var(--ink);background:none;font-size:17px;padding:0;outline:none}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.pick .tx{flex:1;min-width:0}.pick b{font-weight:500;font-size:14px;display:block}.pick span{font-size:12px;color:var(--mute)}
.pick .plus{flex:0 0 34px;height:34px;border:1px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:18px}
.search{width:100%;height:46px;border:1px solid var(--line);padding:0 12px;background:#fff;outline:none}
.cam{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cam label{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:96px;border:1px solid var(--ink);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;background:#fff}
.cam svg{width:24px;height:24px}
.prev{width:100%;max-height:240px;object-fit:cover;display:block;margin-top:12px}
.ai{display:flex;gap:10px;align-items:center;padding:14px;background:var(--soft);margin-top:12px;font-size:13.5px}
.dots i{display:inline-block;width:6px;height:6px;background:var(--ink);margin-right:4px;animation:bl 1s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}@keyframes bl{50%{opacity:.2}}
.ritem{border-bottom:1px solid var(--line);padding:10px 0}
.ritem .h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ritem input{border:0;border-bottom:1px solid var(--line);background:none;width:100%;padding:4px 0;font-size:14px;outline:none}
.ritem .g{width:70px;text-align:right}
.warnbox{border:1px solid var(--warn);color:var(--warn);padding:10px 12px;font-size:13px;margin-top:12px}
/* неделя */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;align-items:end;height:150px;margin-top:16px;border-bottom:1px solid var(--ink);position:relative}
.wk .col{display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative}
.wk .col i{display:block;background:var(--ink)}
.wk .col.fut i{background:var(--line)}
.wk .tl{position:absolute;left:0;right:0;border-top:1px dashed var(--mute)}
.wkl{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);text-align:center;margin-top:6px}
.wkl b{display:block;color:var(--ink);font-weight:500;letter-spacing:0}
.kv{display:grid;grid-template-columns:1fr auto auto;gap:0 14px;margin-top:12px;font-size:14px;border-top:1px solid var(--line)}
.kv>*{padding:10px 0;border-bottom:1px solid var(--line)}
.kv .h{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.st{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:500}.st.ok{color:var(--ok)}.st.lo{color:var(--c)}.st.hi{color:var(--warn)}
.chart svg{width:100%;height:auto;display:block;margin-top:12px}
.note{font-size:11.5px;color:var(--mute);margin-top:24px;line-height:1.55;border-top:1px solid var(--line);padding-top:12px}
.aitext{white-space:pre-wrap;font-size:14.5px;line-height:1.6;margin-top:12px}
.ihint{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 70px);z-index:25;background:#111;color:#fff;padding:12px 44px 12px 14px;font-size:13.5px;line-height:1.45}
.ihint button{position:absolute;right:6px;top:6px;width:36px;height:36px;border:0;background:none;font-size:20px;color:#fff}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="tabbar"><div id="tb"></div></div>
<div id="sh"></div>
<script>
/* ===== Справочники ===== */
const SEED=[ /* избранное из практики: имя, порция г, ккал, Б, Ж, У */
 ['Протеин сывороточный, 1 порция',30,120,25,1.5,2],['Коктейль Shock Milk, бутылка',450,250,40,5,12],['Скир Exponenta Bio-Skyr',500,175,30,0.5,13],
 ['Пудинг Hyper High Protein',200,170,20,4,13],['Грудки запечённые (Лавка)',280,470,86,14,0],['Гречка со сливочным маслом (Лавка)',200,360,11,12,52],
 ['Поке с креветкой/лососем',350,450,28,12,55],['Фо бо',600,430,30,9,55],['Шаурма с курицей',350,725,42,28,76],
 ['Греческий йогурт Teos',250,170,20,5,10],['Яйцо варёное, 1 шт',55,70,6,5,0.5],['Банан, 1 шт',120,105,1,0.4,27]];
const DB=[ /* на 100 г: имя, ккал, Б, Ж, У */
 ['Куриная грудка варёная',137,29.8,1.8,0.5],['Куриное бедро без кожи',185,24,10,0],['Индейка, филе',114,24,1.5,0],['Говядина постная',187,26,9,0],['Фарш говяжий 15%',215,18,15,0],
 ['Свинина постная',200,22,12,0],['Лосось',208,20,13,0],['Тунец консерв. в с/с',103,23,1,0],['Треска',78,17.7,0.7,0],['Креветки варёные',99,21,1.1,0],
 ['Яйцо куриное',157,12.7,11.5,0.7],['Белок яичный',48,11,0.2,0.7],['Творог 5%',121,17.2,5,1.8],['Творог 0%',71,16.5,0,1.3],['Скир / исландский йогурт',63,11,0.2,4],
 ['Греческий йогурт 2%',66,9,2,3.6],['Кефир 1%',40,3,1,4],['Молоко 2,5%',52,2.8,2.5,4.7],['Сыр твёрдый 45%',350,26,27,0],['Моцарелла',280,22,21,2],
 ['Гречка варёная',110,4.2,1.1,21.3],['Рис белый варёный',130,2.7,0.3,28],['Рис бурый варёный',112,2.6,0.9,23.5],['Овсянка (сухая)',366,12.3,6.1,59.5],['Макароны варёные',158,5.8,0.9,31],
 ['Булгур варёный',83,3.1,0.2,18.6],['Киноа варёная',120,4.4,1.9,21.3],['Картофель отварной',82,2,0.4,16.7],['Батат запечённый',90,2,0.2,20.7],['Хлеб цельнозерновой',247,13,3.4,41],
 ['Хлеб белый',265,8,3.2,49],['Лаваш тонкий',275,9,1.2,56],['Банан',89,1.1,0.3,22.8],['Яблоко',52,0.3,0.2,13.8],['Ягоды (смесь)',45,0.8,0.4,10],
 ['Апельсин',47,0.9,0.1,11.8],['Огурец',15,0.7,0.1,3.6],['Помидор',18,0.9,0.2,3.9],['Брокколи',34,2.8,0.4,6.6],['Овощи на пару (смесь)',40,2,0.3,7],
 ['Салат листовой',15,1.4,0.2,2.9],['Авокадо',160,2,14.7,8.5],['Масло оливковое',884,0,100,0],['Масло сливочное 82%',748,0.5,82.5,0.8],['Орехи грецкие',654,15.2,65.2,13.7],
 ['Миндаль',579,21,50,22],['Арахисовая паста',588,25,50,20],['Хумус',166,8,9.6,14],['Фасоль консервированная',94,6.4,0.3,16.7],['Шоколад тёмный 70%',580,8,42,46],
 ['Протеиновый батончик',360,25,10,40],['Мёд',304,0.3,0,82],['Сахар',399,0,0,99.8],['Пицца',266,11,10,33],['Бургер',254,13,12,24]];
const MT=[['b','Завтрак'],['l','Обед'],['d','Ужин'],['s','Перекус']];
const ACT=[[1.2,'Сидячий образ жизни'],[1.375,'Лёгкая активность 1–3 тр./нед'],[1.55,'Умеренная 3–5 тр./нед'],[1.725,'Высокая 6–7 тр./нед'],[1.9,'Очень высокая']];

/* ===== Хранилище: локально + синхронизация через Claude (если доступно) ===== */
const KEY='kbju_v1';
const DEF={profile:{sex:'m',height:184,age:33,weight:82,act:1.55,tdee:2974,manual:true,deficit:600,pk:2,fk:0.85},days:{},body:[],favs:SEED.map(r=>({name:r[0],g:r[1],kcal:r[2],p:r[3],f:r[4],c:r[5]})),u:0};
let S=load();let DBH=null,DBREF=null,SAMPLE=null,saveT=null;
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&v.profile)return v}catch(e){}return JSON.parse(JSON.stringify(DEF))}
function save(){S.u=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(DBREF){clearTimeout(saveT);saveT=setTimeout(()=>{try{DBREF.set({json:JSON.stringify(S),u:S.u}).catch(()=>{})}catch(e){}},800)}}
(async()=>{try{if(!window.claude||!claude.use)return;
 claude.use('sample').then(s=>{SAMPLE=s;render()}).catch(()=>{});
 const db=await claude.use('db'),user=await claude.use('user');if(!db||!user)return;const id=await user.id();if(!id)return;
 DBREF=db.collection('data/users/'+id).doc('state');const snap=await DBREF.get();const d=snap&&(snap.data?snap.data():snap);
 if(d&&d.json&&(d.u||0)>(S.u||0)){S=JSON.parse(d.json);try{localStorage.setItem(KEY,d.json)}catch(e){}render()}else if(S.u)save()}catch(e){}})();

/* ===== Даты ===== */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const today=()=>iso(new Date());
const addD=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const monday=s=>{const d=parse(s);const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return iso(d)};
const DN=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];const MN=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const human=s=>{const d=parse(s);return d.getDate()+' '+MN[d.getMonth()]+', '+DN[(d.getDay()+6)%7].toLowerCase()};
let DAY=today(),TAB='day',ADD=null;
const day=k=>S.days[k]||(S.days[k]={meals:[],water:0,cr:false,train:false,rec:null});
const r0=n=>Math.round(n),r1=n=>Math.round(n*10)/10,d1=n=>String(r1(n)).replace('.',','),dn=v=>v==null?v:String(v).replace('.',',');const sp=n=>r0(n).toLocaleString('ru-RU');

/* ===== Цели (ТЗ п.4.4) ===== */
function targets(){const P=S.profile;const bmr=P.sex==='m'?10*P.weight+6.25*P.height-5*P.age+5:10*P.weight+6.25*P.height-5*P.age-161;
 const tdee=P.manual?P.tdee:r0(bmr*P.act);const kcal=tdee-P.deficit;const p=r0(P.weight*P.pk),f=r0(P.weight*P.fk);const c=Math.max(0,r0((kcal-p*4-f*9)/4));
 return {bmr:r0(bmr),tdee,kcal,p,f,c,wk:{kcal:kcal*7,p:p*7,f:f*7,c:c*7}}}
function sum(meals){return meals.reduce((a,m)=>({kcal:a.kcal+m.kcal,p:a.p+m.p,f:a.f+m.f,c:a.c+m.c}),{kcal:0,p:0,f:0,c:0})}
function weekSum(k){const m=monday(k);const ds=[...Array(7)].map((_,i)=>addD(m,i));return {m,ds,per:ds.map(d=>sum((S.days[d]||{meals:[]}).meals)),tot:sum(ds.flatMap(d=>(S.days[d]||{meals:[]}).meals))}}

/* ===== Коуч: правила раздела 6 ===== */
const STARCH=/паст|макарон|спагет|рис|плов|пицц|тест|хлеб|лаваш|бургер|шаурм|лапш|пельм|вареник|блин|сэндвич|бутерброд|булк|круасс|фо бо|поке|рамен|удон/i;
const SWEET=/шокол|чокопай|марципан|конфет|торт|печень|пирожн|десерт|мороже|вафл|батончик|пудинг|сладк|кекс|маффин/i;
function coach(k,full){const T=targets(),D=day(k),s=sum(D.meals),now=new Date(),isT=k===today(),h=isT?now.getHours():23,out=[];
 const add=(t,b,x)=>out.push({t,b,x});
 if(D.rec!=null&&D.rec<40)add('warn','Восстановление '+D.rec+'%','Ниже 40% — тяжёлую тренировку заменить на лёгкую или отдых.');
 const br=D.meals.filter(m=>m.type==='b');
 if(isT&&h>=12&&!br.length)add('warn','Нет завтрака','Пропуск завтрака ведёт к провалу калорий и углеводов к вечеру. Добавьте белок + углевод.');
 if(br.length){const bs=sum(br);if(bs.p>=15&&bs.c<15)add('','Завтрак без углеводов','Добавьте углевод для энергии: овсянка 50 г (~30 г У) или банан (~27 г У).')}
 const dp=T.p-s.p;if(h>=18&&dp>=30){const left=T.kcal-s.kcal;const opts=[['скир 500 г','~30 г белка, 175 ккал'],['грудка 140 г','~43 г, 230 ккал'],['творог 0% 150 г','~25 г, 110 ккал'],['протеин 1 порция','~25–28 г, 120 ккал']];add('warn','Добрать белок: −'+r0(dp)+' г',(left<300?'Калорий осталось мало — берите постное: ':'Варианты: ')+opts.map(o=>o[0]+' ('+o[1]+')').join('; ')+'.')}
 const st=D.meals.filter(m=>STARCH.test(m.name)).length;if(st>=2)add('','Два крахмалистых приёма','Сегодня уже '+st+' блюда с гарниром/тестом. Вечером — белок + овощи без гарнира.');

 <div class="sec"><span class="kick">Данные</span><button class="btn ghost" onclick="exportCSV()">Экспорт дневника (CSV)</button><button class="btn ghost" onclick="exportJSON()">Резервная копия (JSON)</button><label class="btn ghost" style="display:flex;align-items:center;justify-content:center">Восстановить из копии<input type="file" accept=".json" style="display:none" onchange="importJSON(this)"></label>
 <p class="muted" style="margin:10px 0 0">${DBREF?'Синхронизация с вашим аккаунтом Claude включена.':'Данные хранятся на этом устройстве.'}</p></div>`}
function setP(k,v){const P=S.profile;if(k==='sex')P.sex=v;else if(k==='manual')P.manual=!!+v;else{const n=num(String(v));if(n!=null)P[k]=n}save();render()}
async function dl(name,text,type){try{if(window.claude&&claude.use){const d=await claude.use('downloads');if(d){try{await d.save({filename:name,data:text})}catch(e){}return}}}catch(e){}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),500)}
function exportCSV(){const rows=[['дата','приём','продукт','граммы','ккал','белки','жиры','углеводы','источник']];Object.keys(S.days).sort().forEach(d=>S.days[d].meals.forEach(m=>rows.push([d,(MT.find(x=>x[0]===m.type)||['',''])[1],m.name,r0(m.g||0),r0(m.kcal),r1(m.p),r1(m.f),r1(m.c),m.src||''])));dl('dnevnik.csv','﻿'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\n'),'text/csv')}
function exportJSON(){dl('treker-backup.json',JSON.stringify(S),'application/json')}
function importJSON(inp){const f=inp.files[0];if(!f)return;f.text().then(t=>{try{const v=JSON.parse(t);if(!v.profile)throw 0;if(confirm('Заменить текущие данные копией?')){S=v;save();render()}}catch(e){alert('Файл не подходит')}})}

/* ===== Добавление ===== */
let AM={tab:'fav',type:null,q:'',ph:null,blob:null,busy:false,res:null,err:'',lbl:null,portion:'all',pg:100,item:null,g:100};
function defType(){const h=new Date().getHours();return h<11?'b':h<16?'l':h<21?'d':'s'}
function openAdd(t){ADD=true;AM={...AM,type:t||defType(),res:null,err:'',lbl:null,ph:null,blob:null,item:null,q:''};rSheet()}
function closeAdd(){ADD=null;document.getElementById('sh').innerHTML=''}
function addMeal(m){day(DAY).meals.push({id:Date.now()+Math.random(),type:AM.type,...m,kcal:r0(m.kcal),p:r1(m.p),f:r1(m.f),c:r1(m.c)});save();closeAdd();TAB='day';render()}
const camSvg='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',galSvg='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="1"/><circle cx="9" cy="10" r="2"/><path d="M3 18l6-5 4 3 3-2 5 4"/></svg>';
const camBtns=kind=>`<div class="cam"><label>${camSvg}Камера<input type="file" accept="image/*" capture="environment" style="display:none" onchange="onImg(this,'${kind}')"></label><label>${galSvg}Галерея<input type="file" accept="image/*" style="display:none" onchange="onImg(this,'${kind}')"></label></div>`;
function rSheet(){const tabs=[['photo','Фото блюда'],['label','Этикетка'],['fav','Избранное'],['base','База'],['man','Вручную']];let b='';
 if(AM.tab==='fav'){const fv=S.favs.filter(x=>!AM.q||x.name.toLowerCase().includes(AM.q.toLowerCase()));b=`<input class="search" placeholder="Поиск в избранном" value="${AM.q}" oninput="AM.q=this.value;rSheet();setTimeout(()=>{const s=document.querySelector('.search');s.focus();s.setSelectionRange(99,99)})">${fv.map((x,i)=>`<div class="pick" onclick="addMeal({name:S.favs[${S.favs.indexOf(x)}].name,g:${x.g},kcal:${x.kcal},p:${x.p},f:${x.f},c:${x.c},src:'fav'})"><div class="tx"><b>${x.name}</b><span>${x.g} г · ${x.kcal} ккал · Б ${x.p} · Ж ${x.f} · У ${x.c}</span></div><span class="plus">+</span></div>`).join('')}<p class="muted">Одно касание — и в дневник. Добавляйте в избранное из базы, по фото и вручную.</p>`}
 if(AM.tab==='base'){if(AM.item){const it=AM.item,k=AM.g/100;b=`<div class="pick" style="cursor:default"><div class="tx"><b>${it[0]}</b><span>на 100 г: ${it[1]} ккал · Б ${it[2]} · Ж ${it[3]} · У ${it[4]}</span></div></div><label class="fld"><span>Граммы</span><input inputmode="decimal" value="${AM.g}" oninput="AM.g=num(this.value)||0;document.getElementById('bsum').textContent=sumTxt()"></label><p id="bsum" style="font-size:15px;margin-top:12px">${sumTxt()}</p>
  <button class="btn" onclick="const it=AM.item,k=AM.g/100;addMeal({name:it[0],g:AM.g,kcal:it[1]*k,p:it[2]*k,f:it[3]*k,c:it[4]*k,src:'base'})">Добавить</button><button class="btn ghost" onclick="favFromBase()">Добавить и в избранное</button><button class="lnk" style="margin-top:14px" onclick="AM.item=null;rSheet()">← К списку</button>`}
  else{const L=DB.filter(x=>!AM.q||x[0].toLowerCase().includes(AM.q.toLowerCase()));b=`<input class="search" placeholder="Например: гречка, творог, лосось" value="${AM.q}" oninput="AM.q=this.value;rSheet();setTimeout(()=>{const s=document.querySelector('.search');s.focus();s.setSelectionRange(99,99)})">${L.map(x=>`<div class="pick" onclick="AM.item=DB[${DB.indexOf(x)}];AM.g=100;rSheet()"><div class="tx"><b>${x[0]}</b><span>100 г · ${x[1]} ккал · Б ${x[2]} · Ж ${x[3]} · У ${x[4]}</span></div><span class="plus">›</span></div>`).join('')||'<p class="muted">Не нашли — добавьте вручную.</p>'}`}}
 if(AM.tab==='man')b=`<label class="fld"><span>Название</span><input id="mn" placeholder="Например: салат из столовой"></label><div class="grid2"><label class="fld"><span>Граммы</span><input id="mg" inputmode="decimal"></label><label class="fld"><span>Ккал</span><input id="mk" inputmode="decimal"></label></div><div class="grid4" style="grid-template-columns:repeat(3,1fr)"><label class="fld"><span>Белки</span><input id="mp" inputmode="decimal"></label><label class="fld"><span>Жиры</span><input id="mf" inputmode="decimal"></label><label class="fld"><span>Углев.</span><input id="mc" inputmode="decimal"></label></div>
  <label style="display:flex;gap:8px;align-items:center;margin-top:14px;font-size:13px"><input type="checkbox" id="mfav"> Сохранить в избранное</label><button class="btn" onclick="addManual()">Добавить</button><p class="muted">Если не знаете калории — оставьте пустым, посчитаем из Б/Ж/У.</p>`;
 if(AM.tab==='photo'||AM.tab==='label')b=rAI();
 document.getElementById('sh').innerHTML=`<div class="sheet" onclick="if(event.target===this)closeAdd()"><div class="pn"><div class="top" style="border:0;padding-bottom:0"><span class="kick">Добавить в</span><button class="lnk" onclick="closeAdd()">Закрыть</button></div>
 <div class="chips" style="margin-top:6px">${MT.map(([k,n])=>`<button class="chip ${AM.type===k?'on':''}" onclick="AM.type='${k}';rSheet()">${n}</button>`).join('')}</div>
 <div class="seg">${tabs.map(([k,n])=>`<button class="${AM.tab===k?'on':''}" onclick="AM.tab='${k}';AM.q='';AM.item=null;rSheet()">${n}</button>`).join('')}</div>${b}</div></div>`}
function sumTxt(){const it=AM.item,k=AM.g/100;return `${sp(it[1]*k)} ккал · Б ${d1(it[2]*k)} · Ж ${d1(it[3]*k)} · У ${d1(it[4]*k)}`}
function favFromBase(){const it=AM.item,k=AM.g/100;const m={name:it[0]+', '+AM.g+' г',g:AM.g,kcal:r0(it[1]*k),p:r1(it[2]*k),f:r1(it[3]*k),c:r1(it[4]*k)};S.favs.unshift(m);addMeal({...m,name:it[0],src:'base'})}
function addManual(){const g=id=>num(document.getElementById(id).value);const p=g('mp')||0,f=g('mf')||0,c=g('mc')||0;let k=g('mk');if(k==null)k=p*4+f*9+c*4;const name=document.getElementById('mn').value.trim()||'Без названия';if(!k){alert('Укажите калории или Б/Ж/У');return}
 const m={name,g:g('mg')||0,kcal:k,p,f,c};if(document.getElementById('mfav').checked)S.favs.unshift({...m,kcal:r0(k)});addMeal({...m,src:'man'})}
/* ИИ: фото блюда и этикетки */
function rAI(){const lbl=AM.tab==='label';if(!SAMPLE)return `<p>${lbl?'Распознавание этикетки':'Распознавание блюда по фото'} работает, когда приложение открыто в Claude (по ссылке на артефакт): фото анализирует ИИ.</p><p class="muted">В установленной на экран версии используйте Избранное, Базу или ручной ввод. Для фото в этой версии нужен свой сервер — можем подключить.</p>`;
 let b=AM.ph?`<img class="prev" src="${AM.ph}" alt="">`:`${camBtns(AM.tab)}<p class="muted" style="margin-top:10px">${lbl?'Сфотографируйте таблицу «Пищевая ценность на 100 г» и массу нетто.':'Сфотографируйте тарелку сверху, при хорошем свете. Оценка приблизительная — порцию можно поправить.'}</p>`;
 if(AM.busy)b+=`<div class="ai"><span class="dots"><i></i><i></i><i></i></span>${lbl?'Читаю этикетку…':'Распознаю блюдо…'}</div>`;
 if(AM.err)b+=`<div class="warnbox">${AM.err}</div>`;
 if(!lbl&&AM.res){const R=AM.res;b+=`<p class="kick" style="margin-top:16px">Состав — проверьте граммовку</p>${R.items.map((x,i)=>`<div class="ritem"><div class="h"><input value="${x.name}" onchange="AM.res.items[${i}].name=this.value"><input class="g" inputmode="decimal" value="${r0(x.grams)}" onchange="scaleIt(${i},this.value)"><span class="muted">г</span><button class="x" style="border:0;background:none" onclick="AM.res.items.splice(${i},1);rSheet()">×</button></div><span class="muted">${sp(x.kcal)} ккал · Б ${d1(x.p)} · Ж ${d1(x.f)} · У ${d1(x.c)}</span></div>`).join('')}
  ${R.note?`<p class="muted">${R.note}</p>`:''}<p style="margin-top:12px;font-size:16px"><b style="font-weight:500">Итого: ${sp(sum(R.items).kcal)} ккал</b> · Б ${d1(sum(R.items).p)} · Ж ${d1(sum(R.items).f)} · У ${d1(sum(R.items).c)}</p>
  <button class="btn" onclick="const s=sum(AM.res.items);addMeal({name:AM.res.items.map(x=>x.name).join(' + '),g:AM.res.items.reduce((a,x)=>a+(+x.grams||0),0),...s,src:'photo'})">Добавить в дневник</button><button class="btn ghost" onclick="AM.ph=null;AM.res=null;rSheet()">Другое фото</button>`}
 if(lbl&&AM.lbl){const L=AM.lbl,g=AM.portion==='all'?L.net:AM.portion==='half'?L.net/2:AM.pg,k=(g||0)/100;const pp=L.p*k;
  b+=`<p class="kick" style="margin-top:16px">${L.name||'Продукт'}</p><div class="kv" style="grid-template-columns:1fr auto"><span>На 100 г</span><span>${r0(L.kcal)} ккал · Б ${d1(L.p)} · Ж ${d1(L.f)} · У ${d1(L.c)}</span><span>Масса нетто</span><span>${L.net?r0(L.net)+' г':'не видно'}</span></div>
  <div class="chips">${L.net?`<button class="chip ${AM.portion==='all'?'on':''}" onclick="AM.portion='all';rSheet()">Вся упаковка</button><button class="chip ${AM.portion==='half'?'on':''}" onclick="AM.portion='half';rSheet()">Половина</button>`:''}<button class="chip ${AM.portion==='g'?'on':''}" onclick="AM.portion='g';rSheet()">Граммы</button></div>
  ${AM.portion==='g'?`<label class="fld"><span>Съедено, г</span><input inputmode="decimal" value="${AM.pg}" onchange="AM.pg=num(this.value)||0;rSheet()"></label>`:''}
  <p style="margin-top:12px;font-size:16px"><b style="font-weight:500">${sp(L.kcal*k)} ккал</b> · Б ${d1(pp)} · Ж ${d1(L.f*k)} · У ${d1(L.c*k)} · ${r0(g)} г</p>
  ${(L.claim||/протеин|protein|белк/i.test(L.name||''))&&pp<15?`<div class="warnbox">Позиционируется как «протеиновый», но белка в порции всего ${d1(pp)} г. Считаем граммы белка, а не проценты на упаковке.</div>`:''}
  <button class="btn" onclick="const L=AM.lbl,g=AM.portion==='all'?L.net:AM.portion==='half'?L.net/2:AM.pg,k=g/100;addMeal({name:L.name||'Продукт по этикетке',g,kcal:L.kcal*k,p:L.p*k,f:L.f*k,c:L.c*k,src:'label'})">Добавить в дневник</button><button class="btn ghost" onclick="const L=AM.lbl,g=AM.portion==='all'?L.net:AM.portion==='half'?L.net/2:AM.pg,k=g/100;S.favs.unshift({name:(L.name||'Продукт')+', '+r0(g)+' г',g:r0(g),kcal:r0(L.kcal*k),p:r1(L.p*k),f:r1(L.f*k),c:r1(L.c*k)});save();alert('В избранном')">В избранное</button><button class="btn ghost" onclick="AM.ph=null;AM.lbl=null;rSheet()">Другое фото</button>`}
 return b}
function scaleIt(i,v){const x=AM.res.items[i],g=num(v)||0,k=x.grams?g/x.grams:0;Object.assign(x,{grams:g,kcal:x.kcal*k,p:x.p*k,f:x.f*k,c:x.c*k});rSheet()}
async function shrink(file){const img=await createImageBitmap(file).catch(()=>null);if(!img)return file;const k=Math.min(1,1280/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,'image/jpeg',.85))}
const jparse=t=>{const m=String(t).match(/\{[\s\S]*\}/);return JSON.parse(m?m[0]:t)};
async function onImg(inp,kind){const f=inp.files&&inp.files[0];if(!f)return;AM.ph=URL.createObjectURL(f);AM.busy=true;AM.err='';AM.res=null;AM.lbl=null;AM.portion='all';rSheet();
 try{const blob=await shrink(f);const lim=SAMPLE.limits?await SAMPLE.limits():{images:true};if(lim&&lim.images===false)throw {message:'Фото не поддерживается в этом окне'};
  const P=kind==='label'?`На фото — этикетка продукта. Найди таблицу пищевой ценности НА 100 Г и массу нетто упаковки. Ответь ТОЛЬКО JSON без текста: {"name":"название продукта по-русски коротко","kcal":число_на_100г,"p":белки_на_100г,"f":жиры_на_100г,"c":углеводы_на_100г,"net":масса_нетто_г_или_null,"claim":true_если_продукт_позиционируется_как_протеиновый_или_высокобелковый}. Если значения на порцию, а не на 100 г — пересчитай на 100 г. Числа — числа, не строки.`
  :`На фото — еда. Определи составные части блюда и оцени массу каждой по визуальному объёму (тарелка ~26 см). Посчитай КБЖУ по стандартным таблицам. Ответь ТОЛЬКО JSON без текста: {"items":[{"name":"по-русски, кратко","grams":число,"kcal":число,"p":белки_г,"f":жиры_г,"c":углеводы_г}],"note":"одна короткая оговорка по точности или пусто"}. Учитывай масло/соусы, если видны. Числа — числа.`;
  const r=await SAMPLE(P,{images:[blob],modelTier:'default',cache:false});const j=jparse(r.text);
  if(kind==='label'){if(!(j.kcal>0))throw {message:'Не удалось прочитать таблицу. Сфотографируйте ближе и ровнее.'};AM.lbl={name:j.name,kcal:+j.kcal,p:+j.p||0,f:+j.f||0,c:+j.c||0,net:j.net?+j.net:null,claim:!!j.claim};if(!AM.lbl.net){AM.portion='g';AM.pg=100}}
  else{if(!j.items||!j.items.length)throw {message:'Не удалось распознать блюдо. Попробуйте фото сверху при свете.'};AM.res={items:j.items.map(x=>({name:x.name,grams:+x.grams||0,kcal:+x.kcal||0,p:+x.p||0,f:+x.f||0,c:+x.c||0})),note:j.note||''}}}
 catch(e){AM.err=e&&e.code==='not_granted'?'Нет разрешения на ИИ-анализ в этом окне.':e&&e.code==='rate_limited'?'Слишком много запросов — подождите минуту.':(e&&e.message)||'Ошибка распознавания.'}
 AM.busy=false;rSheet()}
render();

/* ===== PWA ===== */
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)&&!/claude|claudeusercontent/.test(location.hostname)){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
(function(){try{const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);const sa=window.navigator.standalone||window.matchMedia('(display-mode: standalone)').matches;if(ios&&!sa&&!/claude/.test(location.hostname)&&!localStorage.getItem('kb_ihint')){const d=document.createElement('div');d.className='ihint';d.innerHTML='<b>Установите как приложение:</b> «Поделиться» внизу Safari → «На экран „Домой“».<button aria-label="Закрыть">×</button>';d.querySelector('button').onclick=()=>{d.remove();try{localStorage.setItem('kb_ihint','1')}catch(e){}};document.body.appendChild(d)}}catch(e){}})();
</script>
