<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Inter Tight','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased}

button,input,select{font:inherit;color:inherit;border-radius:0}
button{cursor:pointer}

.btn.ghost{background:transparent;color:var(--ink)}.btn[disabled]{opacity:.3}

.hero{display:flex;gap:20px;align-items:center;padding:20px 0 6px}

.ent .k{font-size:15px;font-weight:500;white-space:nowrap}

.wkl{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);text-align:center;margin-top:6px}
.wkl b{display:block;color:var(--ink);font-weight:500;letter-spacing:0}
.kv{display:grid;grid-template-columns:1fr auto auto;gap:0 14px;margin-top:12px;font-size:14px;border-top:1px solid var(--line)}
.kv>*{padding:10px 0;border-bottom:1px solid var(--line)}

.chart svg{width:100%;height:auto;display:block;margin-top:12px}
.note{font-size:11.5px;color:var(--mute);margin-top:24px;line-height:1.55;border-top:1px solid var(--line);padding-top:12px}
.aitext{white-space:pre-wrap;font-size:14.5px;line-height:1.6;margin-top:12px}
.ihint{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 70px);z-index:25;background:#111;color:#fff;padding:12px 44px 12px 14px;font-size:13.5px;line-height:1.45}
.ihint button{position:absolute;right:6px;top:6px;width:36px;height:36px;border:0;background:none;font-size:20px;color:#fff}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

 ['Куриная грудка варёная',137,29.8,1.8,0.5],['Куриное бедро без кожи',185,24,10,0],['Индейка, филе',114,24,1.5,0],['Говядина постная',187,26,9,0],['Фарш говяжий 15%',215,18,15,0],

/* ===== Хранилище: локально + синхронизация через Claude (если доступно) ===== */
const VER=6;const KEY='kbju_v2',OLDKEY='kbju_v1';
try{if(/[?&](new|reset)\b/.test(location.search)){localStorage.removeItem('kbju_v2');history.replaceState(null,'',location.pathname)}}catch(e){}
const DEF={profile:{sex:'m',height:0,age:0,weight:0,act:1.35,tdee:0,manual:false,deficit:0,pk:1.6,fk:0.9},days:{},body:[],favs:starterFavs([]),onb:0,u:0};

const hasOld=()=>{try{const o=JSON.parse(localStorage.getItem(OLDKEY));return o&&o.days&&Object.keys(o.days).some(d=>o.days[d].meals&&o.days[d].meals.length)}catch(e){return false}};

(async()=>{try{if(!window.claude||!claude.use)return;
 claude.use('sample').then(s=>{SAMPLE=s;render()}).catch(()=>{});
 const db=await claude.use('db'),user=await claude.use('user');if(!db||!user)return;const id=await user.id();if(!id)return;
 DBREF=db.collection('data/users/'+id).doc('state2');const snap=await DBREF.get();const d=snap&&(snap.data?snap.data():snap);
 if(d&&d.json&&(d.u||0)>(S.u||0)&&/"onb":1/.test(d.json)){S=JSON.parse(d.json);try{localStorage.setItem(KEY,d.json)}catch(e){}render()}else if(S.u)save()}catch(e){}})();

/* ===== ИИ: Claude в артефакте или свой ключ API на телефоне ===== */

const b64=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(blob)});
async function aiCall(text,blob,onText){
 if(SAMPLE){const o={modelTier:'default',cache:false};if(blob)o.images=[blob];if(onText)o.onText=({text})=>onText(text);const r=await SAMPLE(text,o);return r.text}
 if(!AIC.key||!AIC.prov)return await freeAI(text,blob?await b64(blob):null);
 const model=AIC.model||AIDEF[AIC.prov];const img=blob?await b64(blob):null;let res;
 if(AIC.prov==='anthropic'){const content=[];if(img)content.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:img}});content.push({type:'text',text});
  res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':AIC.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model,max_tokens:1500,messages:[{role:'user',content}]})});
  const j=await res.json().catch(()=>({}));if(!res.ok)throw {message:'ИИ: '+((j.error&&j.error.message)||res.status)};return (j.content||[]).map(c=>c.text||'').join('')}
 const content=[{type:'text',text}];if(img)content.push({type:'image_url',image_url:{url:'data:image/jpeg;base64,'+img}});
 res=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+AIC.key,'X-Title':'Treker'},body:JSON.stringify({model,max_tokens:1500,messages:[{role:'user',content}]})});
 const j=await res.json().catch(()=>({}));if(!res.ok)throw {message:'ИИ: '+((j.error&&j.error.message)||res.status)};const m=((j.choices||[])[0]||{}).message||{};return m.content||''}
async function freeAI(text,img){const content=[{type:'text',text}];if(img)content.push({type:'image_url',image_url:{url:'data:image/jpeg;base64,'+img}});
 const body=JSON.stringify({model:AIC.fmodel||'openai',messages:[{role:'user',content}],max_tokens:1500});

function adaptTDEE(){const t=today(),T=targets();const ds=[...Array(21)].map((_,i)=>addD(t,-i-1));const logged=ds.map(d=>sum((S.days[d]||{meals:[]}).meals).kcal).filter(k=>k>=T.kcal*0.5);

 const xs=W.map(b=>(parse(b.d)-parse(W[0].d))/864e5),ys=W.map(b=>b.w);const mx=xs.reduce((a,b)=>a+b)/xs.length,my=ys.reduce((a,b)=>a+b)/ys.length;const sl=xs.reduce((a,x,i)=>a+(x-mx)*(ys[i]-my),0)/xs.reduce((a,x)=>a+(x-mx)**2,0);

  <div class="chips">${L.net?`<button class="chip ${AM.portion==='all'?'on':''}" onclick="AM.portion='all';rSheet()">Вся упаковка</button><button class="chip ${AM.portion==='half'?'on':''}" onclick="AM.portion='half';rSheet()">Половина</button>`:''}<button class="chip ${AM.portion==='g'?'on':''}" onclick="AM.portion='g';rSheet()">Граммы</button></div>
  ${AM.portion==='g'?`<label class="fld"><span>Съедено, г</span><input inputmode="decimal" value="${AM.pg}" onchange="AM.pg=num(this.value)||0;rSheet()"></label>`:''}
  <p style="margin-top:12px;font-size:16px"><b style="font-weight:500">${sp(L.kcal*k)} ккал</b> · Б ${d1(pp)} · Ж ${d1(L.f*k)} · У ${d1(L.c*k)} · ${r0(g)} г</p>
  ${(L.claim||/протеин|protein|белк/i.test(L.name||''))&&pp<15?`<div class="warnbox">Позиционируется как «протеиновый», но белка в порции всего ${d1(pp)} г. Считаем граммы белка, а не проценты на упаковке.</div>`:''}
  <button class="btn" onclick="const L=AM.lbl,g=AM.portion==='all'?L.net:AM.portion==='half'?L.net/2:AM.pg,k=g/100;addMeal({name:L.name||'Продукт по этикетке',g,kcal:L.kcal*k,p:L.p*k,f:L.f*k,c:L.c*k,src:'label'})">Добавить в дневник</button><button class="btn ghost" onclick="const L=AM.lbl,g=AM.portion==='all'?L.net:AM.portion==='half'?L.net/2:AM.pg,k=g/100;S.favs.unshift({name:(L.name||'Продукт')+', '+r0(g)+' г',g:r0(g),kcal:r0(L.kcal*k),p:r1(L.p*k),f:r1(L.f*k),c:r1(L.c*k)});save();alert('В избранном')">В избранное</button><button class="btn ghost" onclick="AM.ph=null;AM.lbl=null;rSheet()">Другое фото</button>`}
 return b}
function scaleIt(i,v){const x=AM.res.items[i],g=num(v)||0,k=x.grams?g/x.grams:0;Object.assign(x,{grams:g,kcal:x.kcal*k,p:x.p*k,f:x.f*k,c:x.c*k});rSheet()}
async function shrink(file){const img=await createImageBitmap(file).catch(()=>null);if(!img)return file;const k=Math.min(1,1280/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,'image/jpeg',.85))}
const jparse=t=>{const m=String(t).match(/\{[\s\S]*\}/);return JSON.parse(m?m[0]:t)};
async function onImg(inp,kind){const f=inp.files&&inp.files[0];if(!f)return;AM.ph=URL.createObjectURL(f);AM.busy=true;AM.err='';AM.res=null;AM.lbl=null;AM.portion='all';rSheet();
 try{const blob=await shrink(f);if(SAMPLE&&SAMPLE.limits){const lim=await SAMPLE.limits();if(lim&&lim.images===false)throw {message:'Фото не поддерживается в этом окне'}}
  const P=kind==='label'?`На фото — этикетка продукта. Найди таблицу пищевой ценности НА 100 Г и массу нетто упаковки. Ответь ТОЛЬКО JSON без текста: {"name":"название продукта по-русски коротко","kcal":число_на_100г,"p":белки_на_100г,"f":жиры_на_100г,"c":углеводы_на_100г,"net":масса_нетто_г_или_null,"claim":true_если_продукт_позиционируется_как_протеиновый_или_высокобелковый}. Если значения на порцию, а не на 100 г — пересчитай на 100 г. Числа — числа, не строки.`
  :`На фото — еда. Определи составные части блюда и оцени массу каждой по визуальному объёму (тарелка ~26 см). Посчитай КБЖУ по стандартным таблицам. Ответь ТОЛЬКО JSON без текста: {"items":[{"name":"по-русски, кратко","grams":число,"kcal":число,"p":белки_г,"f":жиры_г,"c":углеводы_г}],"note":"одна короткая оговорка по точности или пусто"}. Учитывай масло/соусы, если видны. Числа — числа.`;
  const j=jparse(await aiCall(P,blob));
  if(kind==='label'){if(!(j.kcal>0))throw {message:'Не удалось прочитать таблицу. Сфотографируйте ближе и ровнее.'};AM.lbl={name:j.name,kcal:+j.kcal,p:+j.p||0,f:+j.f||0,c:+j.c||0,net:j.net?+j.net:null,claim:!!j.claim};if(!AM.lbl.net){AM.portion='g';AM.pg=100}}
  else{if(!j.items||!j.items.length)throw {message:'Не удалось распознать блюдо. Попробуйте фото сверху при свете.'};AM.res={items:j.items.map(x=>({name:x.name,grams:+x.grams||0,kcal:+x.kcal||0,p:+x.p||0,f:+x.f||0,c:+x.c||0})),note:j.note||''}}}
 catch(e){AM.err=e&&e.code==='not_granted'?'Нет разрешения на ИИ-анализ в этом окне.':e&&e.code==='rate_limited'?'Слишком много запросов — подождите минуту.':(e&&e.message)||'Ошибка распознавания.'}
 AM.busy=false;rSheet()}
render();

(function(){try{const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);const sa=window.navigator.standalone||window.matchMedia('(display-mode: standalone)').matches;if(ios&&!sa&&!/claude/.test(location.hostname)&&!localStorage.getItem('kb_ihint')){const d=document.createElement('div');d.className='ihint';d.innerHTML='<b>Установите как приложение:</b> «Поделиться» внизу Safari → «На экран „Домой“».<button aria-label="Закрыть">×</button>';d.querySelector('button').onclick=()=>{d.remove();try{localStorage.setItem('kb_ihint','1')}catch(e){}};document.body.appendChild(d)}}catch(e){}})();
